server:
  port: 8084

spring:
  application:
    name: ms-pedidos360-kafka

  kafka:
    # Los 3 brokers: si uno no responde al arrancar, el cliente prueba con los otros
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}

# ── Kafka Pedidos360 ──────────────────────────────────────────────────────────
# La configuración del productor, consumidor y admin está en las clases de config/
pedidos360:
  kafka:
    topics:
      order-events: pedidos360.order-events
      catalog-events: pedidos360.catalog-events
      order-events-dlt: pedidos360.order-events.DLT
      catalog-events-dlt: pedidos360.catalog-events.DLT
    topic-defaults:
      partitions: 3
      replicas: 3
      min-insync-replicas: 2
        # Un grupo por responsabilidad. Dos grupos sobre el mismo tópico = cada uno recibe todo.
    consumer-groups:
      orders-analytics: pedidos360-orders-analytics
      orders-tracking: pedidos360-orders-tracking
      catalog-inventory: pedidos360-catalog-inventory
      dlt-monitor: pedidos360-dlt-monitor
    # Hilos por grupo (máximo útil = número de particiones = 3)
    concurrency:
      orders-analytics: 3
      orders-tracking: 1
      catalog-inventory: 3

  # Bajo este stock se genera una alerta
  inventory:
    low-stock-threshold: 5