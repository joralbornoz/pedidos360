server:
  port: 8084

spring:
  application:
    name: ms-pedidos360-kafka

  kafka:
    # Los 3 brokers: si uno no responde al arrancar, el cliente prueba con los otros
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}

# ── Kafka Pedidos360 ──────────────────────────────────────────────────────────
# La configuración del productor, consumidor y admin está en las clases de config/
pedidos360:
  kafka:
    topics:
      order-events: pedidos360.order-events
      catalog-events: pedidos360.catalog-events
      order-events-dlt: pedidos360.order-events.DLT
      catalog-events-dlt: pedidos360.catalog-events.DLT
    topic-defaults:
      partitions: 3
      replicas: 3
      min-insync-replicas: 2
    consumer-groups:
      orders: pedidos360-orders-group
      catalog: pedidos360-catalog-group
      kafka-ms: pedidos360-kafka-group