server:
  port: 8081

spring:
  application:
    name: ms-pedidos360-orders
  datasource:
    url: jdbc:postgresql://aws-0-sa-east-1.pooler.supabase.com:5432/postgres
    username: postgres.iheybwtypcbgiqitrdpf
    password: ${SUPABASE_DB_PASSWORD}
    hikari:
      maximum-pool-size: 3
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: 5672
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST}
    kafka:
    # La config del productor está en config/KafkaProducerConfig.java
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}

# ── Mensajería: nombres usados al publicar eventos ───────────────────────────
pedidos360:
  rabbit:
    exchange: pedidos360.exchange
    routing-keys:
      status-changed: order.status.changed
  kafka:
    topics:
      order-events: pedidos360.order-events